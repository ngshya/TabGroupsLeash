name: Release

# Publishes a GitHub Release whenever the "version" in extension/manifest.json,
# on main, hasn't been released yet: it tags the current commit vX.Y.Z, zips
# extension/, and attaches the zip to that release. A push to main that doesn't
# bump the version is a no-op — the tag for the current version already exists,
# so the release steps are skipped.
#
# workflow_dispatch runs the same logic on demand (e.g. to retry a failed
# release, or to release the current main without waiting for another push).

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate manifest.json
        run: jq empty extension/manifest.json

      - name: Check whether this version was already released
        id: check
        run: |
          version=$(jq -r '.version' extension/manifest.json)
          tag="v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null 2>&1; then
            echo "$tag already exists, nothing to release."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check required files
        if: steps.check.outputs.should_release == 'true'
        run: |
          for f in manifest.json background.js content.js common.js theme.css popup.html popup.css popup.js options.html options.css options.js icons/icon16.png icons/icon48.png icons/icon128.png; do
            if [ ! -f "extension/$f" ]; then
              echo "::error::Missing extension/$f"
              exit 1
            fi
          done

      - name: Build zip
        if: steps.check.outputs.should_release == 'true'
        id: zip
        run: |
          name="TabGroupsLeash-${{ steps.check.outputs.version }}.zip"
          cd extension
          zip -r "../$name" . -x '*.DS_Store'
          cd ..
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifact
        if: steps.check.outputs.should_release == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.zip.outputs.name }}
          path: ${{ steps.zip.outputs.name }}

      - name: Publish GitHub Release
        if: steps.check.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.check.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: ${{ steps.zip.outputs.name }}
          generate_release_notes: true
