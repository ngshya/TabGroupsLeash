<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>TabGroupsLeash</title>
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <h1>TabGroupsLeash</h1>
    <div class="header-actions">
      <button type="button" class="icon-btn theme-btn" id="themeBtn" title="Theme: System">🖥️</button>
      <label class="switch" title="Enable/disable the extension (synced)">
        <input type="checkbox" id="enabledToggle">
        <span class="slider"></span>
      </label>
    </div>
  </header>

  <main id="groupsList" class="groups-list">
    <p id="emptyState" class="empty" hidden>No tab groups yet — open one, or add rules from the manage page.</p>
  </main>

  <button type="button" class="manage-btn" id="openOptionsBtn">⚙ Manage rules &amp; settings</button>

  <footer>
    <p class="version-line">TabGroupsLeash <span id="versionLabel"></span></p>
  </footer>

  <template id="groupRowTemplate">
    <button type="button" class="group-row">
      <span class="dot"></span>
      <span class="group-row-title"></span>
      <span class="group-row-count"></span>
    </button>
  </template>

  <script src="common.js"></script>
  <script src="popup.js"></script>
</body>
</html>
